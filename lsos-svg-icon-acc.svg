  <path id="bottom-ribbon-arm" d="M 349 307 L 346 310 L 185 398 L 176 409 L 143 498 L 436 340 L 444 332 L 450 318 L 454 264 L 451 252 Z" fill="url(#grad_bot_arm)" />
